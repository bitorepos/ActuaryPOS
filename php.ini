; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)
;test change from big red
display_errors = Off
max_execution_time = 300
max_input_time = 300
max_input_vars = 30000
memory_limit = 512M
post_max_size = 32M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php81"
upload_max_filesize = 32M
zlib.output_compression = Off
extension=intl

; Performance: enable and tune OPcache (live/cPanel server).
; On EA4 the OPcache extension is normally already loaded, so these only tune it.
; If it is not loaded, these directives are harmlessly ignored.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
